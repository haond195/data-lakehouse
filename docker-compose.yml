services:
  minio:
    image: minio/minio:latest
    container_name: local-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 admin password123; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/warehouse;
      exit 0;
      "

  postgres:
    image: postgres:15-alpine
    container_name: local-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metastore
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: local-hms
    depends_on:
      - postgres
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore -Djavax.jdo.option.ConnectionUserName=postgres -Djavax.jdo.option.ConnectionPassword=password"
    ports:
      - "9083:9083"

  trino:
    image: trinodb/trino:latest
    container_name: local-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino-catalog:/etc/trino/catalog
      - ./trino-security/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino-security/rules.json:/etc/trino/rules.json:ro

  superset:
    image: apache/superset:3.1.0
    container_name: local-superset
    depends_on:
      - postgres
      - trino
    environment:
      SUPERSET_SECRET_KEY: "admin_secret_key_lakehouse_demo_12345"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://postgres:password@postgres:5432/superset"
    ports:
      - "8089:8088"
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - ./tail_js_custom_extra.html:/app/superset/templates/tail_js_custom_extra.html
      - ./superset_init_db.py:/app/pythonpath/superset_init_db.py
    user: "root"
    entrypoint: >
      /bin/sh -c "
      pip install sqlalchemy-trino &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin &&
      superset init &&
      python /app/pythonpath/superset_init_db.py &&
      /usr/bin/run-server.sh
      "

  chatbot:
    image: python:3.10-slim
    container_name: local-chatbot
    working_dir: /app
    depends_on:
      - trino
    environment:
      - TRINO_HOST=trino
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://mkp-api.fptcloud.com/v1}
      - LLM_MODEL=${LLM_MODEL:-DeepSeek-V4-Flash}
    volumes:
      - ./chatbot:/app/chatbot
      - ./.streamlit:/app/.streamlit
    ports:
      - "8501:8501"
    command: >
      sh -c "
      pip install streamlit trino pandas google-generativeai &&
      streamlit run chatbot/app.py --server.port 8501 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
      "


volumes:
  minio_storage:
  postgres_data: