name: 'lakehouse_transformation'
version: '1.0.0'
config-version: 2

profile: 'lakehouse_trino'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  lakehouse_transformation:
    bronze:
      +schema: "{{ 'stg_bronze' if target.name == 'stg' else 'retail_bronze' }}"
      +materialized: table
    silver:
      +schema: "{{ 'stg_silver' if target.name == 'stg' else 'retail_silver' }}"
      +materialized: table
    gold:
      +schema: "{{ 'stg_gold' if target.name == 'stg' else 'retail_gold' }}"
      +materialized: table
